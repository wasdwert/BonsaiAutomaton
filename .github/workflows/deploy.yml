name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 👈 Change this to 'master' if your default branch is named master. No

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # 👈 The folder Vite creates after running npm run build
          branch: gh-pages # 👈 The branch where the built files will be pushed
